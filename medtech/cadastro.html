<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · MedTech</title>
  <meta name="description" content="Crie sua conta no MedTech.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <div class="auth">
    <aside class="auth__aside" data-auth-aside></aside>

    <main class="auth__main" id="conteudo">
      <div class="auth__panel">
        <a class="logo logo--dark auth__logo-mobile" href="index.html" data-logo aria-label="MedTech"></a>

        <div class="auth__panel-head">
          <h1>Criar conta</h1>
          <p>Depois do cadastro, enviaremos um link para confirmar seu e-mail.</p>
        </div>

        <div id="config-notice"></div>

        <form class="form" id="signup-form">
          <div id="form-message" aria-live="polite"></div>

          <div class="field">
            <label class="field__label" for="full-name">Nome completo</label>
            <input class="input" id="full-name" name="full-name" type="text" autocomplete="name" maxlength="120" required>
            <p class="field__error" id="full-name-error"></p>
          </div>

          <div class="field">
            <label class="field__label" for="email">E-mail</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="nome@exemplo.com" required>
            <p class="field__error" id="email-error"></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">Senha</label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint" required>
              <button type="button" class="input-group__btn" data-toggle-password="password"></button>
            </div>
            <div class="strength" id="password-strength" data-level="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <p class="field__hint" id="password-hint">Mínimo de 8 caracteres, com letras e números.</p>
            <p class="field__error" id="password-error"></p>
          </div>

          <div class="field">
            <label class="field__label" for="password-confirm">Confirmar senha</label>
            <div class="input-group">
              <input class="input" id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" required>
              <button type="button" class="input-group__btn" data-toggle-password="password-confirm"></button>
            </div>
            <p class="field__error" id="password-confirm-error"></p>
          </div>

          <button type="submit" class="btn btn--primary btn--block" id="submit-button">Criar conta</button>
        </form>

        <p class="auth__footer-link">Já tem conta? <a href="index.html">Entrar</a></p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/pages/cadastro.js"></script>
</body>
</html>
