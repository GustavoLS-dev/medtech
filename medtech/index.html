<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MedTech</title>
  <meta name="description" content="MedTech: cada dose no horário certo, com registro de tudo.">
  <meta name="theme-color" content="#052f38">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/splash.css">
</head>
<body class="splash">
  <!-- Tela de abertura do aplicativo. Depois dela: painel (com sessão) ou login. -->
  <main class="sp-stage" id="stage" aria-labelledby="sp-name">
    <div class="sp-glow" aria-hidden="true"></div>

    <div class="sp-center">
      <!-- Os 7 compartimentos do organizador acendem em volta do logo -->
      <ol class="sp-ring" id="ring" aria-hidden="true">
        <li>S</li><li>T</li><li>Q</li><li>Q</li><li>S</li><li>S</li><li>D</li>
      </ol>

      <button type="button" class="sp-logo" id="logo" aria-label="Logo do MedTech">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="sp-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#14a6bb"/>
              <stop offset="1" stop-color="#0a6f80"/>
            </linearGradient>
          </defs>
          <rect class="sp-logo__box" width="120" height="120" rx="33" fill="url(#sp-grad)"/>
          <g class="sp-capsule">
            <path class="sp-half sp-half--a" d="M60 43.5H40.5a16.5 16.5 0 0 0 0 33H60Z" fill="#ffffff"/>
            <path class="sp-half sp-half--b" d="M60 43.5h19.5a16.5 16.5 0 0 1 0 33H60Z" fill="#5fd0de"/>
          </g>
        </svg>
      </button>
    </div>

    <h1 class="sp-name" id="sp-name" aria-label="MedTech">
      <span aria-hidden="true">M</span><span aria-hidden="true">e</span><span aria-hidden="true">d</span><span class="sp-accent" aria-hidden="true">T</span><span class="sp-accent" aria-hidden="true">e</span><span class="sp-accent" aria-hidden="true">c</span><span class="sp-accent" aria-hidden="true">h</span>
    </h1>
    <p class="sp-tagline" id="tagline">Cada dose no horário certo, com registro de tudo.</p>

    <div class="sp-bottom">
      <div class="sp-progress" id="progress" role="progressbar" aria-label="Carregando" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="progress-bar"></span>
      </div>
      <p class="sp-status" id="status" aria-live="polite">Preparando seu organizador…</p>
      <button type="button" class="sp-start" id="start" hidden>Começar</button>
    </div>

    <button type="button" class="sp-skip" id="skip">Pular</button>
  </main>

  <div class="sp-particles" id="particles" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/pages/splash.js"></script>
</body>
</html>
